    <text x="738" y="78" text-anchor="middle" fill="#abd7d1" font-size="13">Foundations</text>
    <text x="695" y="224" text-anchor="middle" fill="#abd7d1" font-size="13">Support</text>
    <text x="738" y="321" text-anchor="middle" fill="#e4bebe" font-size="13">Tensions</text>
    <text x="1055" y="78" text-anchor="middle" fill="#bac9ec" font-size="13">What to read</text>
    <text x="1090" y="226" text-anchor="middle" fill="#bac9ec" font-size="13">What to trust</text>
    <text x="1055" y="321" text-anchor="middle" fill="#bac9ec" font-size="13">What to test</text>
